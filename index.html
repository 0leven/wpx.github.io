<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WNDRPets Express - Check Service Coverage</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    color: #222;
    min-height: 100vh;
  }

  .card {
    width: 100%;
    max-width: 440px;
    margin: 20px auto;
    background: #fff;
    border-radius: 16px;
    padding: 28px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    text-align: center;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 10px;
  }

  p {
    line-height: 1.5;
    font-size: 15px;
  }

  button {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 22px;
    background: #2563eb;
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 15px 20px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  button:active {
    transform: scale(.98);
  }

  button:disabled {
    opacity: .6;
    cursor: default;
  }

  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    line-height: 1.5;
    display: none;
    font-size: 15px;
  }

  .ok {
    background: #e7f7ec;
    color: #14532d;
  }

  .no {
    background: #fdecec;
    color: #7f1d1d;
  }

  .err {
    background: #fff7e6;
    color: #7c4a03;
  }

  small {
    color: #666;
    line-height: 1.4;
  }
</style>
</head>

<body>

<div class="card">

  <h1>Are we in your area?</h1>

  <p>
    Tap the button below and allow location access.
    We'll use your current location to check whether
    WNDRPets Express services your area.
  </p>

  <button id="btn" type="button">
    📍 Share My Location
  </button>

  <div id="result" class="result"></div>

  <p>
    <small>
      Your location is only used to check service coverage.
    </small>
  </p>

</div>

<script>

var btn = document.getElementById("btn");
var box = document.getElementById("result");

function show(cls, html) {

  box.className = "result " + cls;
  box.innerHTML = html;
  box.style.display = "block";

}


/* =====================================================
   CHECK HTTPS
   ===================================================== */

function checkSecureConnection() {

  if (!window.isSecureContext) {

    show(
      "err",
      "<strong>Secure connection required</strong><br><br>" +
      "Location sharing requires a secure HTTPS connection. " +
      "Please open this page using the WNDRPets Express link."
    );

    return false;
  }

  return true;
}


/* =====================================================
   CHECK LOCATION
   ===================================================== */

function getLocation() {

  if (!checkSecureConnection()) {
    return;
  }

  if (!navigator.geolocation) {

    show(
      "err",
      "<strong>Location not supported</strong><br><br>" +
      "Your browser does not support location sharing."
    );

    return;
  }


  btn.disabled = true;
  btn.textContent = "📍 Getting your location...";

  show(
    "err",
    "Please wait while we get your current location..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      var lat = position.coords.latitude;
      var lng = position.coords.longitude;
      var accuracy = position.coords.accuracy;


      console.log("Latitude:", lat);
      console.log("Longitude:", lng);
      console.log("Accuracy:", accuracy);


      btn.textContent = "Checking service coverage...";


      /*
       * IMPORTANT:
       * This must be the PRODUCTION URL of your
       * POST Webhook node in n8n.
       */

      fetch(
        "https://wpx-test.app.n8n.cloud/webhook/service-coverage-check",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            lat: lat,
            lng: lng,
            accuracy: accuracy
          })
        }
      )

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "Server returned HTTP " + response.status
          );

        }

        return response.json();

      })

      .then(function(data) {

        console.log("n8n response:", data);


        if (data.covered === true) {

          show(
            "ok",
            "<strong>" +
            (data.title || "Good news! Your area is covered.") +
            "</strong><br><br>" +
            (data.client_message || "")
          );

        }

        else if (data.status === "NOT_AVAILABLE") {

          show(
            "no",
            "<strong>" +
            (data.title || "Service not available in your area.") +
            "</strong><br><br>" +
            (data.client_message || "")
          );

        }

        else if (data.error === true) {

          show(
            "err",
            "<strong>" +
            (data.title || "Location unavailable") +
            "</strong><br><br>" +
            (data.client_message || "Please try again.")
          );

        }

        else {

          show(
            "err",
            "<strong>Unable to check coverage</strong><br><br>" +
            "We received an unexpected response. Please try again."
          );

        }


        btn.disabled = false;
        btn.textContent = "Check Again";

      })

      .catch(function(error) {

        console.error("POST error:", error);


        show(
          "err",
          "<strong>Something went wrong</strong><br><br>" +
          "We couldn't connect to the service coverage system. " +
          "Please try again."
        );


        btn.disabled = false;
        btn.textContent = "Try Again";

      });

    },


    function(error) {

      console.error(
        "Geolocation error:",
        error.code,
        error.message
      );


      btn.disabled = false;
      btn.textContent = "Try Again";


      if (error.code === 1) {

        show(
          "err",
          "<strong>Location permission denied</strong><br><br>" +
          "Please allow location access for this website " +
          "in your browser settings, then return here and try again."
        );

      }

      else if (error.code === 2) {

        show(
          "err",
          "<strong>Location unavailable</strong><br><br>" +
          "Your phone could not determine your current location. " +
          "Make sure Location Services are turned on and try again."
        );

      }

      else if (error.code === 3) {

        show(
          "err",
          "<strong>Location request timed out</strong><br><br>" +
          "It took too long to determine your location. " +
          "Please try again."
        );

      }

      else {

        show(
          "err",
          "<strong>Unable to get your location</strong><br><br>" +
          "Please check your phone's location settings and try again."
        );

      }

    },


    {
      enableHighAccuracy: false,
      timeout: 30000,
      maximumAge: 60000
    }

  );

}


btn.addEventListener("click", getLocation);

</script>

</body>
</html>
